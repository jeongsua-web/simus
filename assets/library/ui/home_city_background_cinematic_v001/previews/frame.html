<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIM:US 촬영 구도 미리보기</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif}.page {
    --primary: #59789F;
    --secondary: #A9B6C4;
    --accent: #ECE69D;
    --moss: #7A9445;
    --dark: #243C2C;

    position: relative;
    isolation: isolate;
    display: grid;
    place-items: center;
    flex: 1;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    padding: 64px 24px;
    overflow: hidden;
    background-color: var(--dark);
    background-image: url("/videos/city-background-poster.webp"),
        linear-gradient(135deg, var(--primary), var(--dark) 65%, var(--moss));
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    color: #FFFFFF;
}

/* 전체 화면 도시 영상 */

.backgroundVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
}

/* 영상 위 어두운 오버레이 */

.overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: rgba(36, 60, 44, 0.18);
    pointer-events: none;
}

/* 중앙 정보 카드 */

.hero {
    position: relative;
    z-index: 2;
    width: min(580px, 100%);
    padding: clamp(32px, 6vw, 64px);
    border: 1px solid rgba(169, 182, 196, 0.4);
    border-radius: 28px;
    background: rgba(36, 60, 44, 0.88);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.eyebrow {
    margin-bottom: 22px;
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.18em;
}

.hero h1 {
    margin: 0;
    font-size: clamp(2.25rem, 5vw, 3.75rem);
    font-weight: 900;
    line-height: 1.25;
    letter-spacing: -0.05em;
}

.lead {
    margin: 26px auto 0;
    max-width: 440px;
    color: #E2E8E2;
    font-size: 0.9375rem;
    line-height: 1.9;
    word-break: keep-all;
    overflow-wrap: anywhere;
}

.start {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-height: 54px;
    margin-top: 32px;
    padding: 0 32px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--dark);
    font-size: 0.9375rem;
    font-weight: 800;
    text-decoration: none;
    transition: transform .2s, background .2s;
}

.start:hover {
    background: var(--secondary);
    transform: translateY(-2px);
}

.start:focus-visible,
.playback:focus-visible {
    outline: 3px solid #FFFFFF;
    outline-offset: 4px;
}

.note {
    margin-top: 22px;
    color: var(--secondary);
    font-size: 0.75rem;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
}

.playback {
    position: absolute;
    right: 20px;
    bottom: 12px;
    z-index: 2;
    min-height: 44px;
    padding: 10px 16px;
    border: 1px solid rgba(169, 182, 196, 0.5);
    border-radius: 24px;
    background: rgba(36, 60, 44, 0.9);
    color: #FFFFFF;
    font: inherit;
    font-size: 0.75rem;
    cursor: pointer;
}

@media (max-width: 600px) {
    .page {
        padding: 64px 20px;
    }

    .hero {
        padding: 36px 24px;
        border-radius: 20px;
    }

    .hero h1 {
        font-size: clamp(1.75rem, 8vw, 2.75rem);
    }

    .lead {
        font-size: 0.875rem;
    }

    .start {
        width: 100%;
    }
}

@media (prefers-reduced-motion: reduce) {
    .backgroundVideo,
    .playback {
        display: none;
    }

    .start {
        transition: none;
    }

    .start:hover {
        transform: none;
    }
}
</style><main class="page"><div class="overlay" aria-hidden="true"></div><section class="hero"><h1>당신의 선택이<br>도시를 바꿉니다.</h1><p class="lead">도시에서 벌어지는 상황을 읽고 행동을 선택하세요. 한 사람의 결정이 도시의 변화에 반영됩니다</p><a class="start" href="#" onclick="return false">참여 시작하기 <span>→</span></a></section></main><script>const allowed=['01-shopping-street','02-campus','03-park-neighbourhood'];const shot=new URLSearchParams(location.search).get('shot');document.querySelector('main').style.backgroundImage=`url(${allowed.includes(shot)?shot:allowed[0]}.jpg)`;</script></html>
