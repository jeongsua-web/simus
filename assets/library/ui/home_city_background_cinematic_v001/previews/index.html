<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIM:US — 새 촬영 구도 확인</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0eb;color:#243c2c;font-family:Arial,sans-serif}header{padding:18px 24px;background:white;border-bottom:1px solid #d8dfd7}h1{margin:0 0 10px;font-size:20px}p{margin:8px 0;font-size:14px}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:9px 14px;border:1px solid #b6c6b9;border-radius:8px;background:#f4f6f2;color:#243c2c;cursor:pointer;font:inherit;font-size:14px}button[aria-pressed=true]{color:white;background:#243c2c}#viewport{padding:16px;display:flex;justify-content:center}iframe{display:block;border:0;box-shadow:0 8px 32px #243c2c25;width:100%;height:calc(100vh - 170px);min-height:540px;border-radius:12px}.mobile{width:390px;height:844px;min-height:0;max-width:100%}</style><header><h1>새 촬영 구도 미리보기</h1><nav><button data-shot="01-shopping-street" aria-pressed="true">1. 상점 거리</button><button data-shot="02-campus" aria-pressed="false">2. 캠퍼스</button><button data-shot="03-park-neighbourhood" aria-pressed="false">3. 공원 옆 거리</button><span>｜</span><button id="desktop" aria-pressed="true">가로 화면</button><button id="mobile" aria-pressed="false">세로 화면</button><button id="card" aria-pressed="true">카드 표시</button></nav><p>실제 Unity에서 렌더링한 정지 화면입니다. 영상의 구도와 밝기를 먼저 확인해주세요. 세로 화면은 같은 이미지를 중앙 기준으로 자릅니다.</p></header><div id="viewport"><iframe id="preview" title="홈 화면 촬영 구도" src="frame.html?shot=01-shopping-street"></iframe></div><script>const preview=document.getElementById('preview');let showCard=true;function applyCard(){const doc=preview.contentDocument;doc.querySelector('.hero').hidden=!showCard;doc.querySelector('.overlay').hidden=!showCard;}preview.addEventListener('load',applyCard);document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-shot]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));preview.src='frame.html?shot='+b.dataset.shot;});for(const id of ['desktop','mobile'])document.getElementById(id).onclick=()=>{preview.classList.toggle('mobile',id==='mobile');for(const other of ['desktop','mobile'])document.getElementById(other).setAttribute('aria-pressed',String(other===id));};document.getElementById('card').onclick=e=>{showCard=!showCard;e.target.setAttribute('aria-pressed',String(showCard));applyCard();};</script></html>
