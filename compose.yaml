services:
  web:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    # Linux용 의존성과 빌드 캐시는 Mac의 파일과 분리한다.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      # 컨테이너 사이에서는 localhost가 아니라 Compose 서비스 이름으로 접속한다.
      DATABASE_URL: postgresql://simus:simus_dev_password@db:5432/simus
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - simus_web_node_modules:/app/node_modules
      - simus_web_next:/app/.next
      - simus_web_npm:/root/.npm
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: simus
      POSTGRES_USER: simus
      POSTGRES_PASSWORD: simus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - simus_postgres_data:/var/lib/postgresql/data
      - ./db/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./db/002_session_lifecycle.sql:/docker-entrypoint-initdb.d/002_session_lifecycle.sql:ro
      - ./db/003_session_creation.sql:/docker-entrypoint-initdb.d/003_session_creation.sql:ro
      - ./db/004_participant_npcs.sql:/docker-entrypoint-initdb.d/004_participant_npcs.sql:ro
      - ./db/005_participant_departments.sql:/docker-entrypoint-initdb.d/005_participant_departments.sql:ro
      - ./db:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simus -d simus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  simus_postgres_data:
  simus_web_node_modules:
  simus_web_next:
  simus_web_npm:
