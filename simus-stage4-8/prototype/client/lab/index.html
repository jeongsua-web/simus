<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIM:US NPC 연결 실험</title><style>body{font:16px system-ui;margin:0;background:#f1f5f3;color:#17382e}main{max-width:460px;margin:auto;padding:18px}.warn{padding:12px;background:#fff0be;border-radius:9px}canvas{display:block;width:100%;background:#dce8df;border-radius:12px}dl{background:white;padding:15px;border-radius:9px;overflow-wrap:anywhere}dt{font-weight:bold}dd{margin:0 0 10px}</style></head><body><main><h1>본인 NPC 추적 실험</h1><p class="warn">모의 참여자·모의 위치입니다. 실제 회차, Unity 참여자, DB와 연결되지 않았습니다.</p><canvas id="map" width="400" height="500" aria-label="보행로의 NPC 위치 모의 화면"></canvas><dl><dt>연결</dt><dd id="connection">조회 중</dd><dt>모의 회차 / NPC</dt><dd id="ids">—</dd><dt>응답 지연</dt><dd id="latency">—</dd></dl><p>서버가 발급한 모의 NPC ID와 경로·기준 시각을 재접속 후 복원합니다. 실제 제품에는 본인 쿠키와 회차에 묶인 NPC API가 필요합니다.</p></main><script>
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');let last=null,offset=0;
function paint(){ctx.clearRect(0,0,400,500);ctx.fillStyle='#c4d5c6';ctx.fillRect(0,0,400,500);ctx.fillStyle='#9ea7a3';ctx.fillRect(185,35,30,430);ctx.fillStyle='#ffffff';ctx.font='16px system-ui';ctx.fillText('공유 좌표: Unity x=-64, z=12~45',20,25);if(last){let now=Date.now()/1000+offset;let d=((now-last.epoch)*last.speed+last.phase)%66;let z=d<=33?12+d:78-d;let y=440-(z-12)/33*380;ctx.fillStyle='#124fbd';ctx.beginPath();ctx.arc(200,y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#102d45';ctx.fillText('나의 모의 NPC',220,y+5);}requestAnimationFrame(paint)}
async function poll(){let t=performance.now();try{let r=await fetch('/api/lab/npc',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();last=data;offset=data.server_time-Date.now()/1000;document.querySelector('#ids').textContent=data.round+' / '+data.npc_id;document.querySelector('#latency').textContent=Math.round(performance.now()-t)+'ms';document.querySelector('#connection').textContent='모의 API 연결됨';}catch(e){document.querySelector('#connection').textContent='연결 실패: '+e.message;}}paint();poll();setInterval(poll,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
</script></body></html>
